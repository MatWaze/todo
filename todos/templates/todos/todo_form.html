{% extends 'todos/base.html' %}

{% block title %}{% if todo %}Edit Todo{% else %}Create Todo{% endif %}{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{% if todo %}Edit Todo{% else %}Create New Todo{% endif %}</h2>
    
    <form method="post" class="todo-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" 
                   id="title" 
                   name="title" 
                   value="{% if todo %}{{ todo.title }}{% endif %}"
                   required 
                   placeholder="Enter todo title"
                   maxlength="200">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" 
                      name="description" 
                      rows="4" 
                      placeholder="Enter todo description (optional)">{% if todo %}{{ todo.description }}{% endif %}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if todo %}Update{% else %}Create{% endif %}
            </button>
            <a href="{% url 'todo_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
